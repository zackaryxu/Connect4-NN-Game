<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect 4</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="start-screen">
  <h1>Connect 4</h1>
  <p class="subtitle">now playable in a browser</p>

  <div class="mode-buttons">
    <button id="btn-2p">2 Player</button>
    <p class="diff-label">or vs the bot</p>
    <button id="btn-easy">Easy</button>
    <button id="btn-medium">Medium</button>
    <button id="btn-hard">Hard</button>
    <button id="btn-impossible">Impossible</button>
  </div>
</div>

<div id="game-screen" class="hidden">
  <div id="status"></div>
  <div id="board"></div>
  <br />
  <button id="btn-restart">Back to menu</button>
</div>

<script src="nn.js"></script>
<script src="game.js"></script>
<script src="ai.js"></script>
</body>
</html>
